<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style>
        #map { height: 500px; }
         popup-image {
            max-width: 200px;
            height: auto;
        }
     </style>
</head>
<body>
    <h1>Basic maps</h1>
     <div id="map"></div>
</body>
<script>
   <script>
    var map = L.map('map').setView([8.36014913617249, 124.86748353259433, 17]); 
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
var marker = L.marker([8.36014913617249, 124.86748353259433]).addTo(map);
const dogeImage = "<img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZDK_QVwZrQzGD0ehlmzcmIs1HiQ_8wrPThQ&s' class= 'popup-image' >";
const popupContent =  `${dogeImage}<br><b>Hello world!</b><br>I am a popup.`  ;

marker.bindPopup(popupContent).openPopup();

</script>
marker.bindPopup(popupContent).openPopup();
</script>
</html>
